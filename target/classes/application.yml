spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: cloud-storage-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/cloudstorage?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

# ── Application-level config ──────────────────────────────────────────────────

app:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256.
    # CHANGE THIS in production — never commit the real secret.
    secret: ${JWT_SECRET:cloudvault-dev-secret-key-minimum-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours default

  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  components:
    security-schemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearer-format: JWT

# ── Logging ───────────────────────────────────────────────────────────────────

logging:
  level:
    com.cloudstorage: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN
